# /etc/nginx/sites-available/kyron-scribe.conf — HTTP-only BOOTSTRAP variant.
# Installed automatically by deploy.sh --nginx when no Let's Encrypt cert exists yet
# (a fresh box), so `nginx -t` passes before certbot has ever run. It serves the SPA
# and proxies /api over plain :80 and lets the ACME HTTP-01 challenge through.
#
# Once `sudo certbot --nginx -d <domain>` has issued the cert, re-running
# `deploy.sh --nginx` swaps in the full TLS config (kyron-scribe.conf: 80→301 + 443 ssl).

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Let certbot's webroot/HTTP-01 challenge through.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 2m;

    # --- Static SPA (Vite build output) ---
    root  /opt/kyron-scribe/client/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SSE generation endpoint: buffering OFF (must precede the generic /api) ---
    location /api/generate {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_set_header   Connection "";
        chunked_transfer_encoding on;
    }

    # --- Everything else under /api → Node app ---
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
