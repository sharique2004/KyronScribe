# /etc/nginx/sites-available/kyron-scribe.conf  (symlink into sites-enabled)
# Kyron Scribe reverse proxy (PRD §3, §8).
#
#   80  → 301 redirect to HTTPS
#   443 → TLS (Let's Encrypt via certbot), serves the built SPA and proxies /api
#   Node listens ONLY on 127.0.0.1:4000 — it is never exposed on 80/443 directly.
#
# Before TLS is issued this file references cert paths that don't exist yet, so nginx
# won't start with the 443 block active. deploy.sh --nginx handles this automatically:
# when /etc/letsencrypt/live/${DOMAIN}/ has no cert it installs the HTTP-only
# kyron-scribe-bootstrap.conf instead; after `sudo certbot --nginx -d <domain>` has
# issued the cert, re-running deploy.sh --nginx swaps in THIS full TLS config.
# The ssl_certificate / ssl_certificate_key lines below are exactly what certbot
# manages (it rewrites the paths for your domain and adds the include + dhparam lines).

# ---- Port 80: ACME challenge passthrough + redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Let certbot's webroot/HTTP-01 challenge through without redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Port 443: TLS termination, static SPA, /api proxy ----
server {
    # http2 as a listen parameter (compatible with nginx 1.18 on Ubuntu 22.04;
    # nginx 1.25+ prefers a separate `http2 on;` directive — either works here).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # --- TLS (managed by certbot; paths are rewritten to your domain) ---
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;    # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;      # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;          # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                # managed by Certbot

    # --- Security headers ---
    # HSTS: force HTTPS for a year including subdomains (only enable once cert is stable).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reject oversized request bodies (transcripts are text; 2m is generous).
    client_max_body_size 2m;

    # --- Static SPA (Vite build output) ---
    root  /opt/kyron-scribe/client/dist;
    index index.html;

    # Cache fingerprinted assets aggressively; never cache index.html (SPA shell).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SSE generation endpoint: buffering OFF so tokens stream to the browser ---
    # MUST come before the generic /api block (more specific prefix wins in nginx).
    location /api/generate {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE essentials: no buffering, no caching, long read timeout, keep-alive off
        # so each token flush reaches the client immediately (chunked transfer).
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_set_header   Connection "";
        chunked_transfer_encoding on;
    }

    # --- Everything else under /api → Node app ---
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # --- SPA fallback: client-side routes resolve to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
